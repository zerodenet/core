name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "examples/**"
      - "proto/**"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "examples/**"
      - "proto/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

  check-and-test:
    name: Check & Test (Linux)
    runs-on: ubuntu-22.04
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check (all features)
        run: cargo check --workspace --all-features

      - name: Test (workspace, including connector webhook delivery)
        run: cargo test --workspace --all-features

      - name: Architecture boundary tests
        run: cargo test -p zero-proxy --test runtime_boundary --all-features

  linux-musl-compat:
    name: Build Linux musl compatibility artifact
    runs-on: ubuntu-22.04
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build compatibility binary
        run: cargo build --features full,status-api,connector --release --target x86_64-unknown-linux-musl

      - name: Verify static linkage
        shell: bash
        run: |
          BINARY="target/x86_64-unknown-linux-musl/release/zero"
          file "$BINARY"
          if readelf --program-headers "$BINARY" | grep -q 'INTERP'; then
            echo "::error::The musl compatibility binary is dynamically linked"
            readelf --program-headers "$BINARY" | grep 'INTERP' || true
            exit 1
          fi
          if readelf --version-info "$BINARY" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::The musl compatibility binary still requires glibc"
            readelf --version-info "$BINARY" | grep 'GLIBC_' || true
            exit 1
          fi

  proxy-feature-matrix:
    name: Proxy feature (${{ matrix.name }})
    runs-on: ubuntu-22.04
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-only
            args: ""
          - name: simple-tcp
            args: "--features http"
          - name: registered-association
            args: "--features socks5"
          - name: socket-datagram-packet-path
            args: "--features shadowsocks"
          - name: quic-flow-datagram
            args: "--features hysteria2"
          - name: packet-stream
            args: "--features trojan"
          - name: tuple-two-stream
            args: "--features vless"
          - name: generic-tuple-stream
            args: "--features mieru"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check representative proxy feature family
        run: cargo check -p zero-proxy --no-default-features ${{ matrix.args }}

  optional-surface-matrix:
    name: Optional surface (${{ matrix.feature }})
    runs-on: ubuntu-22.04
    needs: static
    strategy:
      fail-fast: false
      matrix:
        feature:
          - status-api
          - event-dispatcher
          - connector
          - grpc-api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check optional surface independently
        run: cargo check --no-default-features --features ${{ matrix.feature }}
