name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, "fix/**", "feat/**"]
  # Run explicitly on the candidate ref for complete RC qualification.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select CI checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/ci-scope

  static:
    name: Static checks (fmt + clippy)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: "35.0"

      - name: Verify protoc
        run: protoc --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

  check-and-test:
    name: Check & Test (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [scope, static]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: "35.0"

      - name: Verify protoc
        run: protoc --version

      # Clippy already type-checks every target. The workspace suite also runs
      # zero-proxy's runtime_boundary integration test; do not compile it twice.
      - name: Test (workspace, including connector webhook delivery)
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --workspace --all-features

  tun-platform-check:
    name: TUN platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [scope, static]
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check native TUN and socket backends
        run: cargo check -p zero-tun -p zero-platform-tokio

      - name: Compile privileged TUN E2E harness
        # Daily platform checks cover the native backends. The privileged jobs
        # compile/run this harness; keep older-OS compilation for compatibility.
        if: needs.scope.outputs.compatibility == 'true'
        run: cargo test --test tun_privileged_e2e --no-run

  linux-musl-compat:
    name: Build Linux musl compatibility artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [scope, static]
    if: needs.scope.outputs.compatibility == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
          fallback: none

      - name: Verify cross environment
        shell: bash
        run: |
          cross --version
          docker version --format '{{.Server.Version}}'

      - name: Build compatibility binary
        run: cross build --features full,status-api,connector --release --target x86_64-unknown-linux-musl

      - name: Verify static linkage
        shell: bash
        run: |
          BINARY="target/x86_64-unknown-linux-musl/release/zero"
          file "$BINARY"
          if readelf --program-headers "$BINARY" | grep -q 'INTERP'; then
            echo "::error::The musl compatibility binary is dynamically linked"
            readelf --program-headers "$BINARY" | grep 'INTERP' || true
            exit 1
          fi
          if readelf --version-info "$BINARY" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::The musl compatibility binary still requires glibc"
            readelf --version-info "$BINARY" | grep 'GLIBC_' || true
            exit 1
          fi

  proxy-feature-compat:
    name: Proxy feature compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [scope, static]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: "35.0"

      - name: Verify protoc
        run: protoc --version

      - name: Check proxy feature (core-only)
        run: cargo check -p zero-proxy --no-default-features

      - name: Check proxy feature (simple-tcp)
        run: cargo check -p zero-proxy --no-default-features --features http

      - name: Check proxy feature (registered-association)
        run: cargo check -p zero-proxy --no-default-features --features socks5

      - name: Check proxy feature (socket-datagram-packet-path)
        run: cargo check -p zero-proxy --no-default-features --features shadowsocks

      - name: Check proxy feature (quic-flow-datagram)
        run: cargo check -p zero-proxy --no-default-features --features hysteria2

      - name: Check proxy feature (packet-stream)
        run: cargo check -p zero-proxy --no-default-features --features trojan

      - name: Check proxy feature (tuple-two-stream)
        run: cargo check -p zero-proxy --no-default-features --features vless

      - name: Check proxy feature (generic-tuple-stream)
        run: cargo check -p zero-proxy --no-default-features --features mieru

  optional-surface-compat:
    name: Optional surface compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [scope, static]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: "35.0"

      - name: Verify protoc
        run: protoc --version

      - name: Check optional surface (status-api)
        run: cargo check --no-default-features --features status-api

      - name: Check optional surface (event-dispatcher)
        run: cargo check --no-default-features --features event-dispatcher

      - name: Check optional surface (connector)
        run: cargo check --no-default-features --features connector

      - name: Check optional surface (grpc-api)
        run: cargo check --no-default-features --features grpc-api

  result:
    name: CI result
    if: always()
    needs: [scope, static, check-and-test, tun-platform-check, linux-musl-compat, proxy-feature-compat, optional-surface-compat]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const checks = JSON.parse(process.env.CHECK_RESULTS); for (const [name, check] of Object.entries(checks)) { console.log(`${name}: ${check.result}`); if (!["success", "skipped"].includes(check.result)) process.exitCode = 1; }'
