name: Cleanup Promoted Prereleases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cleanup-rc:
    name: Remove RC releases after stable publication
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove RC releases and tags for the published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin --tags --force
          BASE=${CURRENT_TAG#v}
          git tag --list "v${BASE}-rc.*" | while IFS= read -r OLD_TAG; do
            test -n "$OLD_TAG" || continue
            echo "Removing superseded release candidate $OLD_TAG"
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release delete "$OLD_TAG" --cleanup-tag --yes
            else
              git push origin ":refs/tags/$OLD_TAG"
            fi
          done
