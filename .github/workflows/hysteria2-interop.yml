name: Hysteria2 Interop

on:
  push:
    branches: [develop, main]
    paths:
      - 'Cargo.toml'
      - 'vendor/**'
      - 'protocols/hysteria2/**'
      - 'crates/transport/**'
      - 'crates/proxy/**'
      - 'crates/config/**'
      - 'crates/traits/**'
      - '.github/workflows/hysteria2-interop.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'Cargo.toml'
      - 'vendor/**'
      - 'protocols/hysteria2/**'
      - 'crates/transport/**'
      - 'crates/proxy/**'
      - 'crates/config/**'
      - 'crates/traits/**'
      - '.github/workflows/hysteria2-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: Official Hysteria and sing-box TCP/UDP
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
        with:
          version: '35.0'
      - name: Verify QUIC pacing and packet feedback extensions
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/quinn-tests
        run: cargo test --manifest-path vendor/quinn-proto/Cargo.toml --lib
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Reproduce pinned official BBR state vectors
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/hysteria-reference"
          git clone --depth 1 --branch app/v2.12.2 https://github.com/HyNetworks/hysteria.git "$reference"
          test "$(git -C "$reference" rev-parse HEAD)" = 619a6f856b69fb7ee6a7a379e810e68b84004605
          vectors="$GITHUB_WORKSPACE/crates/transport/src/quic/bbr/tests/reference"
          cp "$vectors/generate_test.go" "$reference/core/internal/congestion/bbr/zero_reference_test.go"
          export ZERO_BBR_EVENTS="$vectors/events.csv"
          export ZERO_BBR_EXPECTED="$RUNNER_TEMP/bbr-expected.csv"
          go -C "$reference" test ./core/internal/congestion/bbr -run TestZeroReferenceTrace -count=1
          cmp "$vectors/expected.csv" "$ZERO_BBR_EXPECTED"
      - name: Reproduce pinned receive-window state vectors
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/hysteria-reference"
          test "$(go -C "$reference" list -m -f '{{.Version}}' github.com/apernet/quic-go)" = v0.61.1-0.20260806010916-184d081eef3e
          source_dir="$(go -C "$reference" list -m -f '{{.Dir}}' github.com/apernet/quic-go)"
          copy_dir="$RUNNER_TEMP/quic-window-reference"
          cp -R "$source_dir" "$copy_dir"
          chmod u+w "$copy_dir"
          vectors="$GITHUB_WORKSPACE/crates/transport/src/quic/tests/receive_window_reference"
          cp "$vectors/generate_test.go" "$copy_dir/zero_window_test.go"
          export ZERO_WINDOW_EVENTS="$vectors/events.csv"
          export ZERO_WINDOW_EXPECTED="$RUNNER_TEMP/window-expected.csv"
          go -C "$copy_dir" test . -run TestZeroReceiveWindowReference -count=1
          cmp "$vectors/expected.csv" "$ZERO_WINDOW_EXPECTED"
      - name: Download and verify pinned reference binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hy2-interop"
          cd "$RUNNER_TEMP/hy2-interop"
          curl --fail --location --retry 3 -o hysteria https://github.com/HyNetworks/hysteria/releases/download/app/v2.12.2/hysteria-linux-amd64
          echo '6493dfffd55b5883f64c76c63880ecc32988f0c568c9ca9014907877b4d55f94  hysteria' | sha256sum --check
          curl --fail --location --retry 3 -o sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz
          echo 'f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697  sing-box.tar.gz' | sha256sum --check
          tar -xzf sing-box.tar.gz
          chmod +x hysteria
          ./hysteria version
          ./sing-box-1.13.14-linux-amd64/sing-box version
          echo "HY2_BIN=$RUNNER_TEMP/hy2-interop/hysteria" >> "$GITHUB_ENV"
          echo "SING_BOX_BIN=$RUNNER_TEMP/hy2-interop/sing-box-1.13.14-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Run bidirectional interop, bandwidth loss comparison and reload checks
        env:
          RUST_MIN_STACK: '16777216'
        run: >-
          cargo test --workspace --all-features
          --test hysteria2_official_interop
          --test hysteria2_sing_box_interop
          -- --include-ignored --test-threads=1 --nocapture
