name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  guard:
    name: Verify release tag ancestry
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Fetch authoritative branches and tags
        run: git fetch origin main develop --tags --force

      - name: Validate tag policy
        run: ./scripts/release.sh --verify-tag "$RELEASE_TAG"

      - name: Ensure tag points to its authoritative branch
        shell: bash
        run: |
          BRANCH=main
          if [[ "$RELEASE_TAG" == *-dev.* ]]; then BRANCH=develop; fi
          TAG_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$BRANCH"; then
            echo "::error::Tag ${RELEASE_TAG} is not contained in $BRANCH"
            exit 1
          fi

  quality:
    name: Verify release quality
    runs-on: ubuntu-22.04
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Test workspace contracts
        run: cargo test --workspace --all-features

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [guard, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: linux-x86_64-musl
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            name: darwin-aarch64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Configure LLVM linker (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm 2>/dev/null || true)"
          if [ -z "$LLVM_PREFIX" ]; then
            brew install llvm
            LLVM_PREFIX="$(brew --prefix llvm)"
          fi
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --features full,status-api,connector --release --target ${{ matrix.target }}

      - name: Verify musl static linkage
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/zero"
          file "$BINARY"
          if readelf --program-headers "$BINARY" | grep -q 'INTERP'; then
            echo "::error::The musl artifact is dynamically linked"
            exit 1
          fi
          if readelf --version-info "$BINARY" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::The musl artifact requires glibc"
            exit 1
          fi

      - name: Stage pinned Wintun runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-wintun.ps1 -OutputDirectory "target/${{ matrix.target }}/release"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="zero-${{ matrix.name }}.${{ matrix.ext }}"
          tar czf "$ARCHIVE" zero
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="zero-${{ matrix.name }}.${{ matrix.ext }}"
          test -f zero.exe
          test -f wintun.dll
          test -f wintun-LICENSE.txt
          7z a "$ARCHIVE" zero.exe wintun.dll wintun-LICENSE.txt
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/zero-*.${{ matrix.ext }}*
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          CURRENT_TAG: ${{ env.RELEASE_TAG }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(dev|alpha|beta|rc)\.[1-9][0-9]*)?$' \
            | grep -vFx "$CURRENT_TAG" \
            | head -n 1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
          else
            RANGE="$CURRENT_TAG"
          fi

          {
            echo "## Assets"
            echo ""
            echo "| Platform | Archive |"
            echo "|---|---|"
            echo '| Linux x86_64 (GNU/glibc) | `zero-linux-x86_64.tar.gz` |'
            echo '| Linux x86_64 (musl) | `zero-linux-x86_64-musl.tar.gz` |'
            echo '| macOS x86_64 | `zero-darwin-x86_64.tar.gz` |'
            echo '| macOS aarch64 | `zero-darwin-aarch64.tar.gz` |'
            echo '| Windows x86_64 | `zero-windows-x86_64.zip` |'
            echo ""
            echo "## Changes"
            echo ""
            git log "$RANGE" --no-merges --format='- %s' \
              | grep -ivE '^- release([: ]|$)' || true
            echo ""
            echo "---"
            echo "Generated from $RANGE by GitHub Actions."
          } > /tmp/release-notes.md

      - name: Classify release
        id: kind
        shell: bash
        env:
          CURRENT_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ "$CURRENT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          files: artifacts/*
          draft: ${{ steps.kind.outputs.draft }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          make_latest: ${{ steps.kind.outputs.make_latest }}

      - name: Remove superseded prereleases
        if: success() && contains(env.RELEASE_TAG, '-rc.')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION=${CURRENT_TAG#v}
          BASE=${VERSION%%-*}
          STAGE=dev

          git tag --list "v${BASE}-${STAGE}.*" | while IFS= read -r OLD_TAG; do
            test -n "$OLD_TAG" || continue
            echo "Removing superseded prerelease $OLD_TAG"
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release delete "$OLD_TAG" --cleanup-tag --yes
            else
              git push origin ":refs/tags/$OLD_TAG"
            fi
          done
