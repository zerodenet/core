name: Version Contract

on:
  push:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "release/breaking-changes.md"
      - "release/promotion-source"
      - "scripts/release.ps1"
      - "scripts/release.sh"
      - "scripts/test-release-policy.sh"
      - "scripts/release-notes.py"
      - "scripts/test-release-notes.py"
      - "scripts/nightly-release.py"
      - "scripts/tests/test-nightly-release.py"
      - ".github/scripts/nightly-release.cjs"
      - ".github/scripts/nightly-release.test.cjs"
      - ".github/workflows/nightly-release.yml"
      - "docs/project/release-process.md"
      - "docs/project/tooling.md"
      - ".github/workflows/prepare-release.yml"
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/cleanup-prereleases.yml"
      - ".github/workflows/version-contract.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "release/breaking-changes.md"
      - "release/promotion-source"
      - "scripts/release.ps1"
      - "scripts/release.sh"
      - "scripts/test-release-policy.sh"
      - "scripts/release-notes.py"
      - "scripts/test-release-notes.py"
      - "scripts/nightly-release.py"
      - "scripts/tests/test-nightly-release.py"
      - ".github/scripts/nightly-release.cjs"
      - ".github/scripts/nightly-release.test.cjs"
      - ".github/workflows/nightly-release.yml"
      - "docs/project/release-process.md"
      - "docs/project/tooling.md"
      - ".github/workflows/prepare-release.yml"
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/cleanup-prereleases.yml"
      - ".github/workflows/version-contract.yml"

permissions:
  contents: read

jobs:
  policy:
    name: Validate release policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bash syntax
        run: |
          bash -n scripts/release.sh
          bash -n scripts/test-release-policy.sh

      - name: Release policy tests
        run: bash scripts/test-release-policy.sh

      - name: Release notes channel and ancestry tests
        run: python3 scripts/test-release-notes.py

      - name: Nightly planning, retry and CI dispatch tests
        run: |
          python3 scripts/tests/test-nightly-release.py
          node --test .github/scripts/nightly-release.test.cjs

      - name: Current version contract
        run: ./scripts/release.sh --check

      - name: Pull request version transition
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/release.sh --check-transition "$BASE_SHA" "$HEAD_SHA"

      - name: PowerShell wrapper contract
        shell: pwsh
        run: ./scripts/release.ps1 -Check
