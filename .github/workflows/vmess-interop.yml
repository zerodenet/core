name: VMess Reference Interop

on:
  push:
    branches: [develop, main]
    paths: ['protocols/vmess/**', 'crates/transport/**', 'crates/proxy/**', 'crates/core/**', 'crates/config/**', 'crates/traits/**', 'crates/platform/**', 'Cargo.toml', 'Cargo.lock', 'scripts/prepare-xhttp-interop.py', '.github/workflows/vmess-interop.yml']
  pull_request:
    branches: [develop, main]
    paths: ['protocols/vmess/**', 'crates/transport/**', 'crates/proxy/**', 'crates/core/**', 'crates/config/**', 'crates/traits/**', 'crates/platform/**', 'Cargo.toml', 'Cargo.lock', 'scripts/prepare-xhttp-interop.py', '.github/workflows/vmess-interop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and verify fixed Xray baseline
        run: |
          cargo generate-lockfile
          python3 scripts/prepare-xhttp-interop.py --output "$RUNNER_TEMP/xray-reference"
      - name: Run standard VMess AEAD and zero bidirectional matrix
        env:
          XRAY_BIN: ${{ runner.temp }}/xray-reference/xray
          RUST_MIN_STACK: '16777216'
        run: cargo test --locked -p zero-proxy --all-features --test vmess_xray_interop xray -- --ignored --nocapture
