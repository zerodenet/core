[package]
name = "zero-dns"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
udp = []
doh = ["dep:reqwest"]
dot = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]
doq = ["dep:quinn", "dep:rustls", "dep:webpki-roots"]

[dependencies]
ipnet.workspace = true
idna.workspace = true
tokio.workspace = true
tracing.workspace = true
zero-config = { path = "../config" }
zero-platform-tokio = { path = "../platform/tokio" }
zero-router = { path = "../router" }
zero-traits = { path = "../traits" }

# DoH
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# DoT
tokio-rustls = { version = "0.26", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
webpki-roots = { version = "1", optional = true }

# DoQ
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"], optional = true }

[dev-dependencies]
rcgen = "0.14"
