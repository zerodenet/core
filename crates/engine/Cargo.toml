[package]
autotests = false
name = "zero-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []

[dependencies]
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zero-api = { path = "../api" }
zero-config = { path = "../config" }
zero-core = { path = "../core" }
zero-error = { path = "../error" }
zero-router = { path = "../router" }

[dev-dependencies]
tracing-subscriber.workspace = true
rcgen = "0.14"
serde_json.workspace = true
tokio.workspace = true
zero-rule = { path = "../rule" }

# Integration suites are explicit; scripts/check-test-layout.py guards coverage.

[[test]]
name = "engine_routing"
path = "tests/suites/engine_routing.rs"

[[test]]
name = "engine_endpoints"
path = "tests/suites/engine_endpoints.rs"

[[test]]
name = "engine_policy"
path = "tests/suites/engine_policy.rs"

[[test]]
name = "engine_observability"
path = "tests/suites/engine_observability.rs"
