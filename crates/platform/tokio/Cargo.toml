[package]
autotests = false
name = "zero-platform-tokio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Concrete native-registration suspension for original-custody regressions only.
test-support = []
host-network-stats = []
native-packet-origin = ["dep:zero-tun"]

[dependencies]
# Actual controlled journal rotation retains its original temporary path.
tempfile.workspace = true
# Native UDP metadata helper only; no Quinn runtime or protocol dependency.
quinn-udp = { version = "=0.5.16", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
# Read-only rule mappings retain the existing zero-rule carrier version.
memmap2 = "0.9"
tokio = { workspace = true, features = ["process"] }
zero-traits = { path = "../../traits" }
zero-core = { path = "../../core" }
zero-tun = { path = "../../tun", optional = true }
zero-error = { path = "../../error" }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
netstat2 = "0.11.2"


# Integration suites are explicit; scripts/check-test-layout.py guards coverage.

[[test]]
name = "platform_contracts"
path = "tests/suites/platform_contracts.rs"

[[test]]
name = "icmp_echo"
