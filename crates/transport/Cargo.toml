[package]
name = "zero-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
http_server = ["http_client", "tls", "hyper/server", "hyper/http2", "hyper-util/server-auto"]
http_client = ["dep:tower-service", "dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http-body-util"]
grpc = []
h2 = []
http_upgrade = []
split_http = ["h2", "ws", "http_server", "dep:h3", "dep:h3-quinn"]
mkcp = []
hysteria = ["quic", "http_server", "dep:h3", "dep:h3-quinn"]
quic = ["tls"]
tls = ["dep:aws-lc-rs", "dep:rcgen", "http_client"]
ws = []

[dependencies]
mime = "0.3"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "=0.0.10", optional = true }
base64 = "0.22"
blake2 = "0.10"
data-encoding = "2"
url = "2"
percent-encoding = "2"
httpdate = "1"
tower-service = { version = "0.3", optional = true }
async-trait = "0.1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "=1.9.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
aes = "0.8"
bytes = "1"
futures-util = "0.3"
foreign-types = "0.3"
h2 = "=0.4.14"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "aes", "chacha"] }
http = "1"
quinn-proto = { version = "=0.11.14", default-features = false }
quinn = { workspace = true, features = ["rustls-ring", "runtime-tokio"] }
rand = "0.9"
ring = "0.17"
rustls = { workspace = true }
serde.workspace = true
serde_json.workspace = true
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["non-fips", "alloc"], optional = true }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["x509-parser"], optional = true }
x509-parser = { version = "0.18", default-features = false }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false }
openssl = { version = "=0.10.81", features = ["vendored"] }
openssl-sys = "=0.9.117"
tokio-openssl = "=0.6.5"
tokio-tungstenite = "0.23"
tracing = { workspace = true }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
tungstenite = "0.23"
webpki-roots = "1"
webpki-root-certs = "=1.0.7"
zero-core = { path = "../core" }
zero-error = { path = "../error" }
ztls = { path = "../ztls" }
zero-platform-tokio = { path = "../platform/tokio" }
zero-traits = { path = "../traits" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
hyper = { version = "=1.9.0", features = ["server", "http1"] }
rcgen = "0.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
