[package]
autotests = false
name = "zero-tun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["device"]
packet-memory = ["dep:tokio", "dep:zero-traits"]
device = ["packet-memory", "dep:fs2", "dep:ipnet", "dep:serde", "dep:serde_json", "dep:tracing", "dep:libc", "dep:wintun", "dep:windows-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wintun = { version = "0.4", optional = true }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Rpc", "Win32_System_Threading"] }

[dependencies]
fs2 = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zero-traits = { path = "../traits", optional = true }

[dev-dependencies]
tempfile.workspace = true

# Integration suites are explicit; scripts/check-test-layout.py guards coverage.

[[test]]
name = "tun_device"
required-features = ["device"]
path = "tests/suites/tun_device.rs"

[[test]]
name = "privileged_configuration"
required-features = ["device"]

[[test]]
name = "route_monitor_macos_e2e"
required-features = ["device"]
