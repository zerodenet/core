[package]
autotests = false
name = "zero-tun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["net", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["net", "io-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
wintun = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Rpc", "Win32_System_Threading"] }

[dependencies]
fs2.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
zero-traits = { path = "../traits" }

[dev-dependencies]
tempfile.workspace = true

# Integration suites are explicit; scripts/check-test-layout.py guards coverage.

[[test]]
name = "tun_device"
path = "tests/suites/tun_device.rs"

[[test]]
name = "privileged_configuration"

[[test]]
name = "route_monitor_macos_e2e"
