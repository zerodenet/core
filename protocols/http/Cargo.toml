[package]
name = "http"
version = "0.0.1"  # RFC 7231, no upstream reference
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
runtime = ["dep:tokio", "dep:zero-platform-tokio"]

[dependencies]
tokio = { workspace = true, optional = true }
zero-platform-tokio = { path = "../../crates/platform/tokio", optional = true }
zero-core = { path = "../../crates/core" }
zero-traits = { path = "../../crates/traits" }

[dev-dependencies]
tokio.workspace = true
