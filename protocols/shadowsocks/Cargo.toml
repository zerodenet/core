[package]
name = "shadowsocks"
# Shadowsocks-Rust v1.21.2 / a03006a753486e64717d6e3afa91e0c6d043c557
version = "1.21.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
crypto = [
    "validation",
    "dep:aes",
    "dep:shadowsocks-crypto",
    "dep:aes-gcm",
    "dep:aes-gcm-siv",
    "dep:ccm",
    "dep:sm4",

    "dep:chacha20poly1305",
    "dep:md-5",
    "dep:ring",
    "dep:tokio",
]
validation = ["dep:serde"]
blake3 = ["dep:base64", "dep:blake3"]
runtime = [
    "crypto",
    "dep:async-trait",
    "dep:tracing",
    "dep:bloomfilter",
    "dep:zero-platform-tokio",
    "dep:zero-transport",
]

[dependencies]
aes-gcm = { version = "=0.10.3", optional = true }
aes-gcm-siv = { version = "=0.11.1", optional = true }
ccm = { version = "=0.5.0", optional = true }
sm4 = { version = "=0.5.1", optional = true }

shadowsocks-crypto = { version = "=0.5.5", default-features = false, features = ["v1-aead", "v1-aead-extra", "v1-stream"], optional = true }
serde = { workspace = true, optional = true }
bloomfilter = { version = "=1.0.14", optional = true }
async-trait = { version = "0.1", optional = true }
aes = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
blake3 = { version = "1", optional = true }
chacha20poly1305 = { version = "0.10", optional = true, features = ["reduced-round"] }
md-5 = { version = "0.10", optional = true, default-features = false }
ring = { version = "0.17", optional = true }
tokio = { workspace = true, optional = true, features = ["process"] }
tracing = { workspace = true, optional = true }
zero-core = { path = "../../crates/core" }
zero-platform-tokio = { path = "../../crates/platform/tokio", optional = true }
zero-transport = { path = "../../crates/transport", optional = true }
zero-traits = { path = "../../crates/traits" }

[dev-dependencies]
shadowsocks-crypto = { version = "=0.5.5", default-features = false, features = ["v2-extra"] }
tokio = { workspace = true, features = ["test-util"] }
ring = { version = "0.17" }
chacha20poly1305 = "0.10"
aes = "0.8"

[[test]]
name = "outbound"
required-features = ["runtime"]

[[test]]
name = "shared"
required-features = ["runtime"]

[[test]]
name = "user_profile"
required-features = ["runtime"]

[[test]]
name = "external_sip023"
required-features = ["runtime"]
