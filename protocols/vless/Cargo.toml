[package]
name = "vless"
# Xray-core v26.3.27 / d2758a023cd7f4174a5a5fa4ff66e487d4342ba0
version = "26.3.27"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["tokio", "runtime"]
tokio = ["dep:tokio"]
runtime = ["ztls/validation", "dep:zero-platform-tokio", "dep:zero-transport", "dep:base64", "dep:ml-kem", "dep:blake3", "dep:aes", "dep:aes-gcm", "dep:chacha20poly1305", "dep:ctr", "dep:rand", "dep:x25519-dalek", "dep:prost"]
validation = ["dep:base64", "ztls/validation"]
reality = [
    "ztls/runtime",
    "runtime",
    "tokio",
    "dep:base64",
    "dep:hex",
    "dep:log",
    "dep:rand",
    "dep:rcgen",
    "dep:ring",
    "dep:subtle",
    "dep:zeroize",
    "dep:ml-dsa",
    "dep:x25519-dalek",
    "dep:x509-parser",
]

[dependencies]
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
blake3 = { version = "1.8.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
ctr = { version = "0.9", optional = true }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
ml-kem = { version = "0.2.1", features = ["deterministic", "zeroize"], optional = true }
prost = { version = "0.13", optional = true }
sha1 = { version = "0.10", default-features = false }
url = "2"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
rand = { version = "0.9", optional = true }
rcgen = { version = "0.14", optional = true }
ring = { version = "0.17", optional = true }
subtle = { version = "2.6", optional = true }
tokio = { workspace = true, optional = true }
tracing.workspace = true
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"], optional = true }
x509-parser = { version = "0.18", default-features = false, features = ["verify"], optional = true }
zeroize = { version = "1", optional = true }
zero-core = { path = "../../crates/core" }
zero-platform-tokio = { path = "../../crates/platform/tokio", optional = true }
zero-transport = { path = "../../crates/transport", optional = true, features = ["hysteria", "mkcp", "grpc", "h2", "http_upgrade", "split_http", "quic", "tls", "ws"] }
ztls = { path = "../../crates/ztls", default-features = false }
zero-traits = { path = "../../crates/traits" }

[dev-dependencies]
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
ring = { version = "0.17" }
rand = "0.9"
futures-util = { version = "0.3" }
bytes = "1"
serde_json.workspace = true
tokio-tungstenite = "0.23"
