[package]
autotests = false
name = "wireguard"
# The protocol engine is opt-in until its interoperability and security gates close.
version = "0.9.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
validation = ["dep:base64", "dep:zeroize"]
routing = ["validation"]
runtime = ["routing", "dep:gotatun", "dep:x25519-dalek"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"], optional = true }
gotatun = { version = "=0.9.2", default-features = false, features = ["zeroized-rustcrypto"], optional = true }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
zeroize = { version = "1", default-features = false, features = ["derive"], optional = true }
zero-core = { path = "../../crates/core" }
zero-traits = { path = "../../crates/traits" }

# Integration suites are explicit; scripts/check-test-layout.py guards coverage.

[[test]]
name = "wireguard_model"
path = "tests/suites/wireguard_model.rs"

[[test]]
name = "runtime"
required-features = ["runtime"]
