[package]
name = "rustls-legacy-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR ISC"
description = "Safe, bounded TLS 1.2 CBC record adapter for AWS-LC"
[dependencies]
aws-lc-sys = "=0.40.0"
zeroize = "1"
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["aws-lc-sys"] }
subtle = "2.6"
